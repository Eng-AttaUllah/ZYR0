<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b29"/>
      <stop offset="50%" stop-color="#220e3a"/>
      <stop offset="100%" stop-color="#090312"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="600" height="900" fill="url(#bg)"/>
  <circle cx="300" cy="380" r="280" fill="url(#glow)"/>

  <!-- Subtle grid lines -->
  <g stroke="#c084fc" stroke-opacity="0.08" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="900"/>
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="320" y1="0" x2="320" y2="900"/>
    <line x1="440" y1="0" x2="440" y2="900"/>
    <line x1="520" y1="0" x2="520" y2="900"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="360" x2="600" y2="360"/>
    <line x1="0" y1="540" x2="600" y2="540"/>
    <line x1="0" y1="720" x2="600" y2="720"/>
  </g>

  <!-- Skills Deck UI -->
  <g transform="translate(60, 220)">
    <rect width="480" height="460" rx="20" fill="#12071e" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect width="480" height="460" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

    <!-- Header bar -->
    <rect width="480" height="48" rx="20" fill="#260f3b" fill-opacity="0.8"/>
    <circle cx="32" cy="24" r="5" fill="#f43f5e" fill-opacity="0.8"/>
    <circle cx="48" cy="24" r="5" fill="#eab308" fill-opacity="0.8"/>
    <circle cx="64" cy="24" r="5" fill="#10b981" fill-opacity="0.8"/>
    <text x="240" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e9d5ff" text-anchor="middle">Skills Hub · Modular Capabilities</text>

    <!-- Content: Skill cards grid -->
    <g transform="translate(36, 75)">
      <!-- Search/Filter pill -->
      <rect width="408" height="40" rx="10" fill="#1f0a33" stroke="#4a1d6d" stroke-width="1"/>
      <text x="20" y="25" font-family="system-ui, sans-serif" font-size="12" fill="#d8b4fe">🔍 Browse 240+ verified community &amp; official skills</text>

      <!-- Skill Tiles -->
      <g transform="translate(0, 56)">
        <!-- Skill 1 -->
        <g>
          <rect width="194" height="110" rx="12" fill="#1c0b2d" stroke="#581c87" stroke-width="1"/>
          <circle cx="28" cy="28" r="14" fill="#9333ea" fill-opacity="0.3"/>
          <text x="50" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">SaaS Scaffold</text>
          <text x="18" y="60" font-family="system-ui, sans-serif" font-size="11" fill="#c084fc">React 19 + Stripe Auth</text>
          <rect x="18" y="78" width="70" height="18" rx="9" fill="#a855f7" fill-opacity="0.2"/>
          <text x="53" y="91" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#d8b4fe" text-anchor="middle">2.4k installs</text>
        </g>

        <!-- Skill 2 -->
        <g transform="translate(214, 0)">
          <rect width="194" height="110" rx="12" fill="#1c0b2d" stroke="#581c87" stroke-width="1"/>
          <circle cx="28" cy="28" r="14" fill="#3b82f6" fill-opacity="0.3"/>
          <text x="50" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">PR Gatekeeper</text>
          <text x="18" y="60" font-family="system-ui, sans-serif" font-size="11" fill="#93c5fd">OWASP Code Scanner</text>
          <rect x="18" y="78" width="70" height="18" rx="9" fill="#3b82f6" fill-opacity="0.2"/>
          <text x="53" y="91" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#bfdbfe" text-anchor="middle">1.9k installs</text>
        </g>

        <!-- Skill 3 -->
        <g transform="translate(0, 124)">
          <rect width="194" height="110" rx="12" fill="#1c0b2d" stroke="#581c87" stroke-width="1"/>
          <circle cx="28" cy="28" r="14" fill="#ec4899" fill-opacity="0.3"/>
          <text x="50" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">ArXiv Miner</text>
          <text x="18" y="60" font-family="system-ui, sans-serif" font-size="11" fill="#f472b6">LaTeX &amp; Proof Synth</text>
          <rect x="18" y="78" width="70" height="18" rx="9" fill="#ec4899" fill-opacity="0.2"/>
          <text x="53" y="91" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#fbcfe8" text-anchor="middle">3.8k installs</text>
        </g>

        <!-- Skill 4 -->
        <g transform="translate(214, 124)">
          <rect width="194" height="110" rx="12" fill="#1c0b2d" stroke="#581c87" stroke-width="1"/>
          <circle cx="28" cy="28" r="14" fill="#10b981" fill-opacity="0.3"/>
          <text x="50" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Smart Invoicing</text>
          <text x="18" y="60" font-family="system-ui, sans-serif" font-size="11" fill="#6ee7b7">Auto WhatsApp Fees</text>
          <rect x="18" y="78" width="70" height="18" rx="9" fill="#10b981" fill-opacity="0.2"/>
          <text x="53" y="91" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#a7f3d0" text-anchor="middle">1.1k installs</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Title Overlay -->
  <text x="60" y="770" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="28" fill="#ffffff" letter-spacing="-0.02em">Skills Marketplace</text>
  <text x="60" y="805" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="16" fill="#94a3b8">Supercharge any app with modular extensions</text>
  <rect x="60" y="830" width="165" height="28" rx="14" fill="#c084fc" fill-opacity="0.15" stroke="#c084fc" stroke-opacity="0.4"/>
  <text x="142" y="849" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#c084fc" text-anchor="middle" letter-spacing="0.05em">MODULAR SKILLS</text>
</svg>
