<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="900" fill="url(#bg)"/>

  <!-- Ambient Glow -->
  <circle cx="300" cy="380" r="280" fill="url(#glow)"/>

  <!-- Subtle grid lines -->
  <g stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="900"/>
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="320" y1="0" x2="320" y2="900"/>
    <line x1="440" y1="0" x2="440" y2="900"/>
    <line x1="520" y1="0" x2="520" y2="900"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="360" x2="600" y2="360"/>
    <line x1="0" y1="540" x2="600" y2="540"/>
    <line x1="0" y1="720" x2="600" y2="720"/>
  </g>

  <!-- Window Mockup -->
  <g transform="translate(60, 220)">
    <!-- Window frame -->
    <rect width="480" height="460" rx="20" fill="#090d16" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect width="480" height="460" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

    <!-- Window header -->
    <rect width="480" height="48" rx="20" fill="#0f172a" fill-opacity="0.8"/>
    <circle cx="32" cy="24" r="5" fill="#f43f5e" fill-opacity="0.8"/>
    <circle cx="48" cy="24" r="5" fill="#eab308" fill-opacity="0.8"/>
    <circle cx="64" cy="24" r="5" fill="#10b981" fill-opacity="0.8"/>
    <rect x="180" y="16" width="120" height="16" rx="8" fill="#1e293b"/>

    <!-- Code & Canvas Preview Content -->
    <g transform="translate(36, 80)">
      <!-- Prompt input pill -->
      <rect width="408" height="44" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
      <text x="20" y="27" font-family="monospace" font-size="14" fill="#38bdf8">✦ "Build a sleek SaaS dashboard with real-time stats..."</text>

      <!-- Generated preview box -->
      <g transform="translate(0, 70)">
        <rect width="408" height="230" rx="14" fill="#0a0f1d" stroke="#334155" stroke-width="1"/>
        
        <!-- Mock UI components -->
        <rect x="20" y="20" width="110" height="60" rx="8" fill="#1e293b" fill-opacity="0.7"/>
        <rect x="32" y="32" width="50" height="8" rx="4" fill="#64748b"/>
        <rect x="32" y="48" width="70" height="18" rx="4" fill="#38bdf8" fill-opacity="0.8"/>

        <rect x="145" y="20" width="110" height="60" rx="8" fill="#1e293b" fill-opacity="0.7"/>
        <rect x="157" y="32" width="50" height="8" rx="4" fill="#64748b"/>
        <rect x="157" y="48" width="60" height="18" rx="4" fill="#818cf8" fill-opacity="0.8"/>

        <rect x="270" y="20" width="118" height="60" rx="8" fill="#1e293b" fill-opacity="0.7"/>
        <rect x="282" y="32" width="50" height="8" rx="4" fill="#64748b"/>
        <rect x="282" y="48" width="80" height="18" rx="4" fill="#34d399" fill-opacity="0.8"/>

        <!-- Chart waveform -->
        <path d="M 25 180 Q 80 120 140 150 T 260 110 T 385 130" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
        <path d="M 25 180 Q 80 120 140 150 T 260 110 T 385 130 L 385 200 L 25 200 Z" fill="#38bdf8" fill-opacity="0.1"/>
      </g>
    </g>
  </g>

  <!-- Bottom Title Overlay -->
  <text x="60" y="770" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="28" fill="#ffffff" letter-spacing="-0.02em">ZYR0 Studio</text>
  <text x="60" y="805" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="16" fill="#94a3b8">Prompt-to-production React app builder</text>
  <rect x="60" y="830" width="100" height="28" rx="14" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4"/>
  <text x="110" y="849" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="0.05em">AI BUILDER</text>
</svg>
