<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1205"/>
      <stop offset="50%" stop-color="#2a1b07"/>
      <stop offset="100%" stop-color="#0a0601"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="600" height="900" fill="url(#bg)"/>
  <circle cx="300" cy="380" r="280" fill="url(#glow)"/>

  <!-- Subtle grid lines -->
  <g stroke="#f59e0b" stroke-opacity="0.08" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="900"/>
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="320" y1="0" x2="320" y2="900"/>
    <line x1="440" y1="0" x2="440" y2="900"/>
    <line x1="520" y1="0" x2="520" y2="900"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="360" x2="600" y2="360"/>
    <line x1="0" y1="540" x2="600" y2="540"/>
    <line x1="0" y1="720" x2="600" y2="720"/>
  </g>

  <!-- CLI Console & API Deck UI -->
  <g transform="translate(60, 220)">
    <rect width="480" height="460" rx="20" fill="#140d04" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect width="480" height="460" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

    <!-- Header bar -->
    <rect width="480" height="48" rx="20" fill="#2d1c07" fill-opacity="0.8"/>
    <circle cx="32" cy="24" r="5" fill="#f43f5e" fill-opacity="0.8"/>
    <circle cx="48" cy="24" r="5" fill="#eab308" fill-opacity="0.8"/>
    <circle cx="64" cy="24" r="5" fill="#10b981" fill-opacity="0.8"/>
    <text x="240" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#fde68a" text-anchor="middle">Developer CLI &amp; Cloud Gateway</text>

    <!-- Content: CLI Terminal and API endpoints -->
    <g transform="translate(36, 75)">
      <!-- Terminal window -->
      <rect width="408" height="295" rx="12" fill="#0c0702" stroke="#451a03" stroke-width="1"/>
      
      <!-- Terminal prompt lines -->
      <g transform="translate(20, 28)" font-family="monospace" font-size="12">
        <text x="0" y="0" fill="#78716c">$ npx @zyro/cli deploy --env=production</text>
        <text x="0" y="24" fill="#fbbf24">✔ Resolving cloud endpoints and edge network...</text>
        <text x="0" y="48" fill="#a8a29e">  - Studio Container: 2.1s (built)</text>
        <text x="0" y="72" fill="#a8a29e">  - Database Migrations: Neon Postgres OK</text>
        <text x="0" y="96" fill="#a8a29e">  - Auth Gateway: Supabase OAuth synced</text>
        <text x="0" y="120" fill="#34d399">✔ Live deployment ready: https://app.zyroo.org</text>

        <line x1="0" y1="140" x2="368" y2="140" stroke="#292524" stroke-width="1"/>

        <!-- API Request Snippet -->
        <text x="0" y="165" fill="#f59e0b">curl -X POST https://api.zyroo.org/v1/agent \</text>
        <text x="20" y="187" fill="#fde68a">-H "Authorization: Bearer zyr_live_92a..." \</text>
        <text x="20" y="209" fill="#fde68a">-d '{"goal": "synthesize_q3_report"}'</text>

        <rect x="0" y="225" width="140" height="24" rx="6" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.4"/>
        <text x="70" y="241" fill="#fde047" font-weight="600" text-anchor="middle">HTTP/2 200 OK</text>
      </g>
    </g>
  </g>

  <!-- Bottom Title Overlay -->
  <text x="60" y="770" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="28" fill="#ffffff" letter-spacing="-0.02em">Developer Engine</text>
  <text x="60" y="805" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="16" fill="#94a3b8">CLI tooling, open REST APIs &amp; cloud deploy</text>
  <rect x="60" y="830" width="160" height="28" rx="14" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.4"/>
  <text x="140" y="849" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f59e0b" text-anchor="middle" letter-spacing="0.05em">OPEN PLATFORM</text>
</svg>
