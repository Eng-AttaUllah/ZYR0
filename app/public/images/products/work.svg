<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061c14"/>
      <stop offset="50%" stop-color="#0a291e"/>
      <stop offset="100%" stop-color="#020d09"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="600" height="900" fill="url(#bg)"/>
  <circle cx="300" cy="380" r="280" fill="url(#glow)"/>

  <!-- Subtle grid lines -->
  <g stroke="#34d399" stroke-opacity="0.08" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="900"/>
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="320" y1="0" x2="320" y2="900"/>
    <line x1="440" y1="0" x2="440" y2="900"/>
    <line x1="520" y1="0" x2="520" y2="900"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="360" x2="600" y2="360"/>
    <line x1="0" y1="540" x2="600" y2="540"/>
    <line x1="0" y1="720" x2="600" y2="720"/>
  </g>

  <!-- Work & Proof Card UI -->
  <g transform="translate(60, 220)">
    <rect width="480" height="460" rx="20" fill="#061811" stroke="#34d399" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect width="480" height="460" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

    <!-- Header bar -->
    <rect width="480" height="48" rx="20" fill="#0b2e21" fill-opacity="0.8"/>
    <circle cx="32" cy="24" r="5" fill="#f43f5e" fill-opacity="0.8"/>
    <circle cx="48" cy="24" r="5" fill="#eab308" fill-opacity="0.8"/>
    <circle cx="64" cy="24" r="5" fill="#10b981" fill-opacity="0.8"/>
    <text x="240" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#a7f3d0" text-anchor="middle">ZYR0 Work · Cryptographic Proof</text>

    <!-- Content: PR Review & Verified Badge -->
    <g transform="translate(36, 75)">
      <!-- Certificate Pill -->
      <rect width="408" height="74" rx="12" fill="#0a2a1e" stroke="#059669" stroke-width="1"/>
      <g transform="translate(20, 16)">
        <rect width="42" height="42" rx="10" fill="#10b981" fill-opacity="0.2"/>
        <path d="M 14 21 L 19 26 L 28 15" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="56" y="20" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Offer &amp; Experience Verified</text>
        <text x="56" y="38" font-family="monospace" font-size="11" fill="#6ee7b7">ECDSA sha256:7f8a92c...09b4</text>
      </g>

      <!-- GitHub PR-style drawer preview -->
      <g transform="translate(0, 90)">
        <rect width="408" height="205" rx="12" fill="#05150f" stroke="#064e3b" stroke-width="1"/>
        
        <!-- PR Title -->
        <g transform="translate(20, 20)">
          <rect width="70" height="22" rx="11" fill="#10b981" fill-opacity="0.2"/>
          <text x="35" y="15" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">MERGED</text>
          <text x="82" y="16" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">feat(engine): distributed caching pipeline</text>
        </g>
        <line x1="20" y1="56" x2="388" y2="56" stroke="#064e3b" stroke-width="1"/>

        <!-- Diff preview lines -->
        <g transform="translate(20, 75)" font-family="monospace" font-size="12">
          <rect width="368" height="24" fill="#065f46" fill-opacity="0.3"/>
          <text x="12" y="16" fill="#34d399">+ export async function cacheWorkerSync() {</text>

          <g transform="translate(0, 28)">
            <rect width="368" height="24" fill="#065f46" fill-opacity="0.3"/>
            <text x="12" y="16" fill="#34d399">+   const node = await cluster.acquireLock();</text>
          </g>

          <g transform="translate(0, 56)">
            <text x="12" y="16" fill="#94a3b8">    return node.commitBlock();</text>
          </g>
        </g>

        <!-- Mentor approval stamp -->
        <g transform="translate(20, 165)">
          <circle cx="12" cy="12" r="10" fill="#10b981" fill-opacity="0.3"/>
          <text x="30" y="16" font-family="system-ui, sans-serif" font-size="11" fill="#a7f3d0">Approved by Lead Architect (Stripe Guild)</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Title Overlay -->
  <text x="60" y="770" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="28" fill="#ffffff" letter-spacing="-0.02em">ZYR0 Work</text>
  <text x="60" y="805" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="16" fill="#94a3b8">Project-driven internships &amp; proof-of-work</text>
  <rect x="60" y="830" width="165" height="28" rx="14" fill="#34d399" fill-opacity="0.15" stroke="#34d399" stroke-opacity="0.4"/>
  <text x="142" y="849" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle" letter-spacing="0.05em">INTERNSHIP ENGINE</text>
</svg>
