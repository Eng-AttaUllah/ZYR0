<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e27"/>
      <stop offset="50%" stop-color="#111638"/>
      <stop offset="100%" stop-color="#050716"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="600" height="900" fill="url(#bg)"/>
  <circle cx="300" cy="380" r="280" fill="url(#glow)"/>

  <!-- Subtle grid lines -->
  <g stroke="#818cf8" stroke-opacity="0.08" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="900"/>
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="320" y1="0" x2="320" y2="900"/>
    <line x1="440" y1="0" x2="440" y2="900"/>
    <line x1="520" y1="0" x2="520" y2="900"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="360" x2="600" y2="360"/>
    <line x1="0" y1="540" x2="600" y2="540"/>
    <line x1="0" y1="720" x2="600" y2="720"/>
  </g>

  <!-- Institution Card UI -->
  <g transform="translate(60, 220)">
    <rect width="480" height="460" rx="20" fill="#0b0f24" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect width="480" height="460" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

    <!-- Header bar -->
    <rect width="480" height="48" rx="20" fill="#181d45" fill-opacity="0.8"/>
    <circle cx="32" cy="24" r="5" fill="#f43f5e" fill-opacity="0.8"/>
    <circle cx="48" cy="24" r="5" fill="#eab308" fill-opacity="0.8"/>
    <circle cx="64" cy="24" r="5" fill="#10b981" fill-opacity="0.8"/>
    <text x="240" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#a5b4fc" text-anchor="middle">School OS · Live Telemetry</text>

    <!-- Content: Analytics & Roster -->
    <g transform="translate(36, 75)">
      <!-- Top metric blocks -->
      <g>
        <rect width="125" height="70" rx="10" fill="#151b47" stroke="#312e81" stroke-width="1"/>
        <text x="16" y="28" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Active Students</text>
        <text x="16" y="55" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#818cf8">2,480</text>
      </g>
      <g transform="translate(142, 0)">
        <rect width="125" height="70" rx="10" fill="#151b47" stroke="#312e81" stroke-width="1"/>
        <text x="16" y="28" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Fee Collections</text>
        <text x="16" y="55" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#34d399">98.4%</text>
      </g>
      <g transform="translate(284, 0)">
        <rect width="124" height="70" rx="10" fill="#151b47" stroke="#312e81" stroke-width="1"/>
        <text x="16" y="28" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Attendance</text>
        <text x="16" y="55" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#c084fc">96.8%</text>
      </g>

      <!-- Roster table rows -->
      <g transform="translate(0, 90)">
        <rect width="408" height="210" rx="12" fill="#0d1230" stroke="#1e1b4b" stroke-width="1"/>
        
        <!-- Table header -->
        <rect width="408" height="34" rx="12" fill="#181e4b" fill-opacity="0.6"/>
        <text x="20" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">CLASS &amp; SECTION</text>
        <text x="200" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">SCHEDULE</text>
        <text x="330" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">STATUS</text>

        <!-- Rows -->
        <g transform="translate(20, 52)">
          <text x="0" y="14" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Grade 11 · CS Lab A</text>
          <text x="180" y="14" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">09:00 - 10:30 AM</text>
          <rect x="300" y="0" width="70" height="20" rx="10" fill="#10b981" fill-opacity="0.2"/>
          <text x="335" y="14" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#34d399" text-anchor="middle">ACTIVE</text>
        </g>
        <line x1="20" y1="86" x2="388" y2="86" stroke="#1e293b" stroke-width="1"/>

        <g transform="translate(20, 106)">
          <text x="0" y="14" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Grade 12 · Physics</text>
          <text x="180" y="14" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">10:45 - 12:15 PM</text>
          <rect x="300" y="0" width="70" height="20" rx="10" fill="#818cf8" fill-opacity="0.2"/>
          <text x="335" y="14" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#818cf8" text-anchor="middle">SCHEDULED</text>
        </g>
        <line x1="20" y1="140" x2="388" y2="140" stroke="#1e293b" stroke-width="1"/>

        <g transform="translate(20, 160)">
          <text x="0" y="14" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Faculty Substitution</text>
          <text x="180" y="14" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">AI Reallocated</text>
          <rect x="300" y="0" width="70" height="20" rx="10" fill="#38bdf8" fill-opacity="0.2"/>
          <text x="335" y="14" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#38bdf8" text-anchor="middle">RESOLVED</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Title Overlay -->
  <text x="60" y="770" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="28" fill="#ffffff" letter-spacing="-0.02em">ZYR0 School OS</text>
  <text x="60" y="805" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="16" fill="#94a3b8">Autonomous operating system for campuses</text>
  <rect x="60" y="830" width="130" height="28" rx="14" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8" stroke-opacity="0.4"/>
  <text x="125" y="849" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#818cf8" text-anchor="middle" letter-spacing="0.05em">INSTITUTION SAAS</text>
</svg>
